<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스플렌더 라이트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20260921f">
</head>
<body>
<div id="app">
  <header id="header">
    <h1>스플렌더 라이트 <span class="badge">2~4인 데모</span></h1>
    <div class="header-actions">
      <button id="statsBtn" type="button">전적</button>
      <button id="newGameBtn">새 게임</button>
    </div>
  </header>

  <nav id="modeTabs">
    <button id="modeSingleBtn" class="mode-tab active" type="button">싱글 플레이</button>
    <button id="modeOnlineBtn" class="mode-tab" type="button">온라인 대전</button>
    <div id="countPicker">
      <span class="count-label">인원</span>
      <button class="count-tab active" type="button" data-count="2">2인</button>
      <button class="count-tab" type="button" data-count="3">3인</button>
      <button class="count-tab" type="button" data-count="4">4인</button>
    </div>
  </nav>

  <section id="netPanel" hidden></section>

  <div id="gameArea">
    <div id="banner"></div>

    <div id="tableLayout">
      <aside class="player-column" id="playerColLeft"></aside>

      <div id="tableCenter">
        <section id="nobles"></section>

        <section id="board">
          <div class="tier" id="tier3"></div>
          <div class="tier" id="tier2"></div>
          <div class="tier" id="tier1"></div>
        </section>

        <section id="bank"></section>

        <section id="controls">
          <div id="pendingArea">
            <span id="pendingLabel">가져올 보석:</span>
            <div id="pendingChips"></div>
            <button id="confirmTakeBtn" disabled>확정</button>
            <button id="cancelTakeBtn" disabled>취소</button>
          </div>
        </section>
      </div>

      <aside class="player-column" id="playerColRight"></aside>
    </div>

    <div id="bottomRow">
      <section id="log"></section>

      <section id="chatPanel" hidden>
        <h2 class="chat-title">채팅</h2>
        <ul id="chatLog"></ul>
        <div id="chatForm">
          <input id="chatInput" type="text" maxlength="120" autocomplete="off" placeholder="대전이 시작되면 채팅할 수 있습니다" disabled>
          <button id="chatSendBtn" type="button" disabled>전송</button>
        </div>
      </section>
    </div>
  </div>
</div>

<div id="modalOverlay" class="hidden">
  <div id="modal"></div>
</div>

<div id="statsOverlay" class="hidden">
  <div id="statsBox">
    <div id="statsHeader">
      <h2>전적</h2>
      <button id="statsCloseBtn" type="button">닫기</button>
    </div>
    <div id="statsBody"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script src="cards.js?v=20260921f"></script>
<script src="game.js?v=20260921f"></script>
<script src="ai.js?v=20260921f"></script>
<script src="stats.js?v=20260921f"></script>
<script src="chat.js?v=20260921f"></script>
<script src="net.js?v=20260921f"></script>
</body>
</html>
