<!DOCTYPE html>
<html lang="ko" data-game-title="스플렌더 듀얼">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스플렌더 듀얼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261103r">
<link rel="stylesheet" href="duel.css?v=20261103r">
</head>
<body>
<div id="app">
  <header id="header">
    <h1>스플렌더 듀얼 <span class="badge">2인 전용</span></h1>
    <div class="header-actions">
      <button id="quietBtn" type="button" aria-pressed="false">저채도</button>
      <button id="dHelpBtn" type="button" aria-pressed="true" title="규칙 도우미를 켜고 끕니다">도우미 켬</button>
      <button id="dRuleBtn" type="button">규칙</button>
      <button id="dStatsBtn" type="button">전적</button>
      <button id="dNewBtn" type="button">새 게임</button>
    </div>
  </header>

  <nav id="dModeTabs">
    <button id="dModeSingle" class="mode-tab" type="button">혼자 연습</button>
    <button id="dModeOnline" class="mode-tab" type="button">온라인 대전</button>
  </nav>

  <section id="dNetPanel" hidden></section>

  <div id="dSinglePick" hidden></div>

  <section id="dStart">
    <div class="start-box">
      <div id="dStartPick"></div>
      <h2>어떻게 하시겠어요?</h2>
      <div class="start-actions">
        <button type="button" data-d-start="single">
          <strong>혼자 연습</strong>
          <span>AI를 상대로 규칙을 익힙니다</span>
        </button>
        <button type="button" data-d-start="online">
          <strong>온라인 대전</strong>
          <span>방을 만들거나 방 코드로 참가합니다</span>
        </button>
      </div>
      <p class="start-hint">2인 전용입니다.<span id="dTempHint"> 카드 구성은 <b>임시</b>이며 실제 상자의 카드와 다릅니다.</span></p>
    </div>
  </section>

  <div id="dGame" hidden>
    <div id="dBanner" class="banner"></div>
    <div id="dNotice" class="d-notice" role="status" aria-live="polite" hidden></div>
    <div id="dTable">
      <aside class="player-column" id="dMe"></aside>
      <div id="dCenter">
        <section id="dRoyals"></section>
        <section id="dPyramid"></section>
        <div id="dBoardRow">
          <section id="dBoardWrap">
            <div class="bank-title">토큰판</div>
            <div id="dBoard"></div>
          </section>
          <section id="dControls"></section>
        </div>
      </div>
      <aside class="player-column" id="dOpp"></aside>
    </div>
  </div>

  <!-- 게임판 밖에 둔다. 대기방에서는 판이 없어도 채팅은 써야 하기 때문이다. -->
  <div id="dBottom">
    <section id="dLog" hidden></section>
    <section id="dChatPanel" hidden>
      <h2 class="chat-title">채팅</h2>
      <ul id="dChatLog"></ul>
      <div id="dChatForm">
        <input id="dChatInput" type="text" maxlength="120" autocomplete="off" placeholder="메시지를 입력하세요" disabled>
        <button id="dChatSend" type="button" disabled>전송</button>
      </div>
    </section>
  </div>
</div>

<aside id="dHelper" class="d-helper" aria-label="규칙 도우미" hidden>
  <div class="d-help-head">
    <b>규칙 도우미</b>
    <span class="d-help-btns">
      <button type="button" data-help="min" aria-expanded="true">접기</button>
      <button type="button" data-help="off">끄기</button>
    </span>
  </div>
  <div id="dHelpBrief" class="d-help-brief"></div>
  <div id="dHelpBody">
    <div id="dHelpNow"></div>
    <div id="dHelpRef"></div>
  </div>
</aside>

<div id="modalOverlay" class="hidden">
  <div id="modal"></div>
</div>

<div id="statsOverlay" class="hidden">
  <div id="statsBox">
    <div id="statsHeader">
      <h2>듀얼 전적</h2>
      <button id="statsCloseBtn" type="button">닫기</button>
    </div>
    <div id="statsBody"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5/dist/mqtt.min.js"></script>
<script>
  // 한 배포처가 막히면 다른 곳에서 받아 본다. 회사망에서 특정 CDN만 막는 경우가 있다.
  if (typeof mqtt === 'undefined') {
    document.write('<script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"><\/script>');
  }
</script>
<script src="gamepick.js?v=20261103r"></script>
<script src="roomhop.js?v=20261103r"></script>
<script src="duel-cards.js?v=20261103r"></script>
<script src="duel-engine.js?v=20261103r"></script>
<script src="duel-ai.js?v=20261103r"></script>
<script src="relay.js?v=20261103r"></script>
<script src="db.js?v=20261103r"></script>
<script src="duel-ui.js?v=20261103r"></script>
<script src="duel-help.js?v=20261103r"></script>
<script src="duel-stats.js?v=20261103r"></script>
<script src="duel-net.js?v=20261103r"></script>
<script src="quiet.js?v=20261103r"></script>
</body>
</html>
