<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>예전 판 등록 - 스플렌더 라이트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20260929b">
<style>
  #wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 60px; }
  #wrap h1 { font-size: 20px; margin: 0 0 6px; }
  .lead { color: var(--muted); font-size: 13px; line-height: 1.7; margin-bottom: 20px; }
  .card {
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .card h2 { font-size: 13px; color: var(--muted); margin: 0 0 10px; font-weight: 500; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  td, th { padding: 7px 4px; border-bottom: 1px solid var(--border); text-align: left; }
  th { font-size: 11px; color: var(--muted); font-weight: 500; }
  tr:last-child td { border-bottom: none; }
  .win { color: var(--gem-green); font-weight: 700; }
  .lose { color: var(--gem-red); }
  .bad { color: var(--gem-red); }
  code { font-size: 11px; color: var(--muted); word-break: break-all; }
  #go { font-size: 14px; padding: 10px 22px; font-weight: 700; }
  #out { margin-top: 12px; font-size: 13px; line-height: 1.7; white-space: pre-wrap; }
  .backlink { display: inline-block; margin-top: 18px; font-size: 13px; }
</style>
</head>
<body>
<div id="wrap">
  <h1>예전 판 등록</h1>
  <p class="lead">
    랭킹이 판 기록 방식으로 바뀌기 전에 둔 판들을 한 번만 등록합니다.
    최호동수석님 전적(5전 5승)과 상대별 전적으로 역산해 확인한 5판입니다.<br>
    <b>이 페이지는 한 번만 쓰면 됩니다.</b> 같은 판을 두 번 넣지 않으니 실수로 여러 번 눌러도 괜찮습니다.
  </p>

  <div class="card">
    <h2>이 브라우저에서 찾은 사람들</h2>
    <div id="who">확인 중...</div>
  </div>

  <div class="card">
    <h2>등록할 판</h2>
    <div id="plan">확인 중...</div>
  </div>

  <button id="go" disabled>등록하기</button>
  <div id="out"></div>

  <a class="backlink" href="./">← 게임으로 돌아가기</a>
</div>

<script src="db.js?v=20260929b"></script>
<script>
'use strict';

// 역산으로 확인한 예전 판 (최호동수석 5전 5승 / 인턴재박이 3승 / 차주 1승 + 3인 1판)
//   2인 3판: 최호동수석 > 인턴재박이
//   2인 1판: 최호동수석 > 차주
//   3인 1판: 최호동수석 > 인턴재박이, 차주
// 검산: 판별 인원 합 11 = 각자 판수 합 11, 총 승수 5 = 판수 5
var PAST = [
  { id: 'old-1', n: 2, win: 'me', lose: ['인턴재박이'] },
  { id: 'old-2', n: 2, win: 'me', lose: ['인턴재박이'] },
  { id: 'old-3', n: 2, win: 'me', lose: ['인턴재박이'] },
  { id: 'old-4', n: 2, win: 'me', lose: ['차주'] },
  { id: 'old-5', n: 3, win: 'me', lose: ['인턴재박이', '차주'] },
];

function readProfile() {
  try {
    return JSON.parse(localStorage.getItem('splendorLiteProfile') || 'null');
  } catch (e) {
    return null;
  }
}

function readStats() {
  try {
    return JSON.parse(localStorage.getItem('splendorLiteStats') || 'null');
  } catch (e) {
    return null;
  }
}

// 상대의 기기 ID는 내 상대별 전적에 들어 있다. 이름으로 찾는다.
function findPeople() {
  var prof = readProfile();
  var st = readStats();
  var me = prof && prof.id ? { id: prof.id, name: (prof.name || '나').slice(0, 12) } : null;
  var byName = {};
  if (st && st.opponents) {
    Object.keys(st.opponents).forEach(function (key) {
      if (key === 'AI') return;
      var rec = st.opponents[key];
      if (rec && rec.name) byName[rec.name] = { id: key, name: rec.name };
    });
  }
  return { me: me, byName: byName };
}

var people = findPeople();
var whoEl = document.getElementById('who');
var planEl = document.getElementById('plan');
var goEl = document.getElementById('go');
var outEl = document.getElementById('out');

var needed = ['인턴재박이', '차주'];
var missing = needed.filter(function (n) { return !people.byName[n]; });

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

if (!people.me) {
  whoEl.innerHTML = '<span class="bad">이 브라우저에서 전적을 찾지 못했습니다. 게임을 한 번 열었던 브라우저에서 이 페이지를 열어 주세요.</span>';
} else {
  var rows = '<table><tr><th>이름</th><th>기기 ID</th></tr>';
  rows += '<tr><td><b>' + esc(people.me.name) + '</b> (나)</td><td><code>' + esc(people.me.id) + '</code></td></tr>';
  needed.forEach(function (n) {
    var p = people.byName[n];
    rows += '<tr><td>' + esc(n) + '</td><td>' + (p ? '<code>' + esc(p.id) + '</code>' : '<span class="bad">못 찾음</span>') + '</td></tr>';
  });
  rows += '</table>';
  if (missing.length) {
    rows += '<p class="lead bad" style="margin:10px 0 0">' + esc(missing.join(', ')) +
      ' 을(를) 상대별 전적에서 찾지 못했습니다. 이 브라우저가 맞는지 확인해 주세요.</p>';
  }
  whoEl.innerHTML = rows;
}

function buildGames() {
  var out = [];
  // 예전 판이므로 시각을 과거로 둔다 (하루 간격)
  var base = Date.now() - 7 * 86400000;
  PAST.forEach(function (g, i) {
    var p = [{ id: people.me.id, name: people.me.name, r: 'w' }];
    var ok = true;
    g.lose.forEach(function (n) {
      var who = people.byName[n];
      if (!who) { ok = false; return; }
      p.push({ id: who.id, name: who.name, r: 'l' });
    });
    if (!ok || p.length !== g.n) return;
    out.push({ key: 'g-' + g.id, body: { at: base + i * 3600000, n: g.n, p: p } });
  });
  return out;
}

var games = people.me && !missing.length ? buildGames() : [];

if (!games.length) {
  planEl.innerHTML = '<span class="bad">등록할 판을 만들지 못했습니다.</span>';
} else {
  var t = '<table><tr><th>판</th><th>인원</th><th>결과</th></tr>';
  games.forEach(function (g, i) {
    var names = g.body.p.map(function (x) {
      return '<span class="' + (x.r === 'w' ? 'win' : 'lose') + '">' + esc(x.name) + (x.r === 'w' ? ' 승' : ' 패') + '</span>';
    }).join(' · ');
    t += '<tr><td>' + (i + 1) + '</td><td>' + g.body.n + '인</td><td>' + names + '</td></tr>';
  });
  t += '</table>';
  planEl.innerHTML = t;
  goEl.disabled = false;
}

goEl.addEventListener('click', function () {
  goEl.disabled = true;
  outEl.textContent = '등록 중...';
  var done = 0;
  var failed = 0;
  var existed = 0;
  Promise.all(games.map(function (g) {
    return fetch(DB_URL + '/games/' + g.key + '.json', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(g.body),
    }).then(function (res) {
      if (res.ok) done += 1;
      else if (res.status === 401 || res.status === 403) existed += 1; // 이미 있는 판은 규칙이 막는다
      else failed += 1;
    }).catch(function () {
      failed += 1;
    });
  })).then(function () {
    var msg = done + '판 등록했습니다.';
    if (existed) msg += '\n' + existed + '판은 이미 등록되어 있어 건너뛰었습니다.';
    if (failed) msg += '\n' + failed + '판은 실패했습니다. 랭킹 서버에 닿지 못했을 수 있습니다.';
    msg += '\n\n게임으로 돌아가 전적 창을 열고 새로고침을 눌러 확인해 주세요.';
    outEl.textContent = msg;
    goEl.disabled = false;
  });
});
</script>
</body>
</html>
